[project]
name = "production-grade-agentic-system"
version = "1.0.0"
description = "Production-grade agentic system: FastAPI, LangGraph, PostgreSQL, Langfuse, Prometheus and Grafana"
readme = "README.md"
requires-python = ">=3.13"
# Upper bounds stop at the next major version: a new major can change APIs this code uses
# (mem0 2 moved search's user_id into filters, for one), so moving to one is a deliberate step.
dependencies = [
    "fastapi>=0.163.1",
    # Not imported here, but Langfuse's LangChain callback handler needs it
    "langchain>=1.0.5,<2",
    "langchain-core>=1.8.1,<2",
    "langchain-openai>=1.8.0,<2",
    "langfuse>=3.15.0,<4",
    "langgraph>=1.2.22,<2",
    "langgraph-checkpoint-postgres>=3.2.1,<4",
    "mem0ai>=2.2.1,<3",
    "openai>=3.51.0,<4",
    "bcrypt>=5.0.0,<6",
    "pyjwt>=2.15.1,<3",
    "psycopg[binary,pool]>=3.3.9,<4",
    "pydantic[email]>=2.14.3,<3",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "sqlalchemy>=2.1.8,<3",
    "sqlmodel>=0.0.50",
    "structlog>=26.1.0",
    "uvicorn>=0.54.0",
    "uvloop>=0.23.0; sys_platform != 'win32'",
    "slowapi>=0.1.10",
    "prometheus-client>=0.26.0",
    "ddgs>=9.16.1",
    "tenacity>=9.2.1",
    "tqdm>=4.70.1",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = ["black", "isort", "flake8", "ruff", "djlint==1.36.4"]

[dependency-groups]
test = ["httpx>=0.28.1", "pytest>=9.2.0", "pyyaml>=6.0.3"]


[tool.pytest.ini_options]
markers = ["slow: marks tests as slow (deselect with '-m \"not slow\"')"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 119
exclude = "venv|migrations"

[tool.flake8]
docstring-convention = "all"
ignore = ["D107", "D212", "E501", "W503", "W605", "D203", "D100"]
exclude = "venv|migrations"
max-line-length = 119

# radon
radon-max-cc = 10

[tool.isort]
profile = "black"
multi_line_output = "VERTICAL_HANGING_INDENT"
force_grid_wrap = 2
line_length = 119
skip = ["migrations", "venv"]

[tool.pylint."messages control"]
disable = [
    "line-too-long",
    "trailing-whitespace",
    "missing-function-docstring",
    "consider-using-f-string",
    "import-error",
    "too-few-public-methods",
    "redefined-outer-name",
]

[tool.pylint.master]
ignore = "migrations"

[tool.ruff]
line-length = 119
exclude = ["migrations", "*.ipynb", "venv"]

[tool.ruff.lint]
# Enable flake8-bugbear (`B`) rules and docstring (`D`) rules
select = ["E", "F", "B", "ERA", "D"]
# Never enforce `E501` (line length violations).
ignore = ["E501", "F401", "D203", "D213", "B904", "B008"]
# Avoid trying to fix flake8-bugbear (`B`) violations.
unfixable = ["B"]

[tool.ruff.lint.pydocstyle]
convention = "google"

# Ignore `E402` (import violations) in all `__init__.py` files
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["E402"]
# The evals CLI puts the project root on sys.path before importing the application
"evals/*.py" = ["E402"]
# Test names say what they check; docstrings would repeat them
"tests/*.py" = ["D"]
